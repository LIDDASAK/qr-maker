<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QR Workspace</title>
    <link rel="stylesheet" href="./fonts/PhetsarathOT/phetsarath.css" />
    <style>
      :root {
        --ink: #17324d;
        --muted: #6d7d8c;
        --green: #23834f;
        --pale: #e9f0f4;
        --line: #d8e1e7;
        --white: #fff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        color: var(--ink);
        background: linear-gradient(135deg, #1b7e4e 0 34%, #e9f0f4 34% 100%);
        font-family: "Phetsarath OT", sans-serif;
      }
      .topbar {
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px 24px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }
      .brand img {
        width: 230px;
        height: auto;
        display: block;
      }
      .topbar a {
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      .page {
        max-width: 1180px;
        margin: 0 auto;
        padding: 18px 24px 64px;
      }
      .shell {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        min-height: 570px;
        overflow: hidden;
        border-radius: 8px;
        background: var(--white);
        box-shadow: 0 18px 50px rgba(15, 39, 52, 0.18);
      }
      .sidebar {
        padding: 24px 16px;
        background: #f2f6f8;
        border-right: 1px solid var(--line);
      }
      .eyebrow {
        margin: 0 8px 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .sidebar h1 {
        margin: 0 8px 22px;
        color: var(--ink);
        font-size: 24px;
        line-height: 1.3;
      }
      .types {
        display: grid;
        gap: 6px;
      }
      .type {
        padding: 11px 12px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: #506474;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .type:hover,
      .type.active {
        background: #fff;
        color: var(--green);
        box-shadow: 0 2px 8px rgba(23, 50, 77, 0.08);
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 26px;
        padding: 30px;
      }
      .form h2 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      .form p {
        margin: 0 0 25px;
        color: var(--muted);
        font-size: 13px;
      }
      label {
        display: block;
        margin: 0 0 7px;
        color: #586b79;
        font-size: 12px;
        font-weight: 700;
      }
      textarea,
      input,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: #fff;
        font: inherit;
      }
      textarea {
        min-height: 142px;
        padding: 14px;
        resize: vertical;
      }
      input,
      select {
        height: 44px;
        padding: 0 12px;
      }
      textarea:focus,
      input:focus,
      select:focus {
        border-color: #40a9d8;
        outline: 3px solid rgba(64, 169, 216, 0.16);
      }
      .field {
        margin-bottom: 18px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 25px;
      }
      button.action {
        min-height: 42px;
        padding: 0 18px;
        border: 0;
        border-radius: 4px;
        color: #fff;
        background: var(--green);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.action.secondary {
        color: #159ad4;
        background: #e4f5fc;
      }
      button.action:hover {
        filter: brightness(0.95);
      }
      .preview {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 400px;
        padding: 22px;
        border-left: 1px solid var(--line);
        background: #fbfcfd;
      }
      .preview h3 {
        align-self: flex-start;
        margin: 0 0 18px;
        font-size: 16px;
      }
      #qr {
        width: 250px;
        height: 250px;
        max-width: 100%;
        image-rendering: pixelated;
      }
      .preview small {
        margin-top: 14px;
        color: var(--muted);
        text-align: center;
      }
      .status {
        min-height: 20px;
        margin-top: 12px;
        color: #b34141;
        font-size: 12px;
      }
      @media (max-width: 850px) {
        .shell,
        .workspace {
          grid-template-columns: 1fr;
        }
        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .types {
          grid-template-columns: repeat(4, 1fr);
        }
        .workspace {
          gap: 18px;
          padding: 22px;
        }
        .preview {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
      @media (max-width: 560px) {
        .topbar {
          padding: 14px 16px;
        }
        .brand img {
          width: 190px;
        }
        .topbar a {
          display: none;
        }
        .page {
          padding: 10px 12px 36px;
        }
        .types {
          grid-template-columns: repeat(2, 1fr);
        }
        .two {
          grid-template-columns: 1fr;
        }
        .workspace {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html"
        ><img src="./img/company-logo.png?v=20260923-1" alt="Phan Liddasak"
      /></a>
      <a href="./index.html">QR CODE MAKER</a>
    </header>
    <main class="page">
      <section class="shell">
        <aside class="sidebar">
          <p class="eyebrow">QR Workspace</p>
          <h1>Create a new code</h1>
          <div class="types" id="types">
            <button class="type active" data-type="url">Website URL</button>
            <button class="type" data-type="text">Text</button>
            <button class="type" data-type="email">Email</button>
            <button class="type" data-type="phone">Phone</button>
            <button class="type" data-type="wifi">Wi-Fi</button>
            <button class="type" data-type="location">Location</button>
          </div>
        </aside>
        <section class="workspace">
          <div class="form">
            <h2 id="form-title">Website URL</h2>
            <p>Enter your content, then generate a downloadable QR code.</p>
            <div class="field">
              <label for="content">Content</label
              ><textarea id="content" placeholder="https://example.com">
https://www.phanliddasak.com</textarea
              >
            </div>
            <div class="two">
              <div class="field">
                <label for="foreground">Foreground</label
                ><input id="foreground" type="color" value="#17324d" />
              </div>
              <div class="field">
                <label for="background">Background</label
                ><input id="background" type="color" value="#ffffff" />
              </div>
            </div>
            <div class="actions">
              <button class="action" id="generate">Generate QR Code</button
              ><button class="action secondary" id="download" disabled>
                Download PNG
              </button>
            </div>
            <div class="status" id="status" role="status"></div>
          </div>
          <aside class="preview">
            <h3>Live preview</h3>
            <canvas id="qr" width="500" height="500"></canvas
            ><small id="preview-label">Website URL</small>
          </aside>
        </section>
      </section>
    </main>
    <script>
      (function () {
        var qrConstructorPromise = fetch("./vendor/qrcode.min.js")
          .then(function (response) {
            return response.text();
          })
          .then(function (source) {
            return new Function(source + "\nreturn QRCode;")();
          });
        var currentType = "url";
        var typeNames = {
          url: "Website URL",
          text: "Text",
          email: "Email",
          phone: "Phone",
          wifi: "Wi-Fi",
          location: "Location",
        };
        var content = document.getElementById("content");
        var title = document.getElementById("form-title");
        var label = document.getElementById("preview-label");
        var canvas = document.getElementById("qr");
        var download = document.getElementById("download");
        var status = document.getElementById("status");
        function getData() {
          var value = content.value.trim();
          if (currentType === "email") return "mailto:" + value;
          if (currentType === "phone") return "tel:" + value;
          if (currentType === "wifi") return "WIFI:T:WPA;S:" + value + ";P:;;";
          if (currentType === "location") return "geo:" + value;
          return value;
        }
        function generate() {
          if (!content.value.trim()) {
            status.textContent = "Please enter content first.";
            return;
          }
          status.textContent = "";
          qrConstructorPromise
            .then(function (QRCodeConstructor) {
              var holder = document.createElement("div");
              var instance = new QRCodeConstructor(holder, {
                text: getData(),
                width: 500,
                height: 500,
                colorDark: document.getElementById("foreground").value,
                colorLight: document.getElementById("background").value,
                correctLevel: QRCodeConstructor.CorrectLevel.H,
              });
              window.setTimeout(function () {
                var source = holder.querySelector("canvas, img");
                if (!source) {
                  status.textContent = "Could not generate this QR code.";
                  download.disabled = true;
                  return;
                }
                var context = canvas.getContext("2d");
                context.clearRect(0, 0, canvas.width, canvas.height);
                context.drawImage(source, 0, 0, canvas.width, canvas.height);
                download.disabled = false;
              }, 60);
            })
            .catch(function () {
              status.textContent = "Could not generate this QR code.";
              download.disabled = true;
            });
        }
        document.querySelectorAll(".type").forEach(function (button) {
          button.addEventListener("click", function () {
            currentType = button.dataset.type;
            document.querySelectorAll(".type").forEach(function (item) {
              item.classList.remove("active");
            });
            button.classList.add("active");
            title.textContent = typeNames[currentType];
            label.textContent = typeNames[currentType];
            content.value =
              currentType === "url" ? "https://www.phanliddasak.com" : "";
            content.placeholder =
              currentType === "location"
                ? "17.97064,102.618607"
                : "Enter content";
            generate();
          });
        });
        document.getElementById("generate").addEventListener("click", generate);
        document
          .getElementById("foreground")
          .addEventListener("input", generate);
        document
          .getElementById("background")
          .addEventListener("input", generate);
        download.addEventListener("click", function () {
          var link = document.createElement("a");
          link.download = "qr-code.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        });
        generate();
      })();
    </script>
  </body>
</html>
